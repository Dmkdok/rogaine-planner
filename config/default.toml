passable = true
note = "not an area class: contours only feed the slope penalty (T015), never the speed table"

[[terrain]]
name = "unknown"
isom = ""
shade = "none"
speed_factor = 0.35
passable = true
note = "unclassified pixels are assumed to be forest — the most common terrain, and not optimistic"

# --------------------------------------------------------------------------------------------
# Grid/border-line shape exclusion (T074, F20, ADR-012)
# --------------------------------------------------------------------------------------------
[grid]
# A column (or row) whose water_shallow/water_uncrossable pixel fraction reaches this is a
# candidate grid/magnetic-north/border line, not real water. Measured against
# `data/maps/grid-lines-red-controls/map.jpeg` (I1): its 8 known grid columns plus one border
# column range 0.338-0.898; the synthetic fixture's own noisiest column (JPEG-degraded render,
# `test_segment.py`'s IoU floor test) never exceeds 0.145. Set to 0.25, roughly midway between
# the two, with margin on both sides.
span_fraction_min = 0.25
# A candidate run wider than this (mm on paper, converted to pixels via DPI -- never hardcoded in
# pixels, same convention as every sibling geometric tunable) is not a line: it is left classified
# as real terrain instead. Measured: the widest real line/border run in the same scan is ~4.95mm
# (39px @ 200dpi, the map's own border rule); set to 6.0mm for margin. Any real lake or marsh large
# enough to clear `span_fraction_min` is, on any real map scale, far wider than this -- ADR-012's
# own accepted edge case is a genuinely line-width river, not a lake.
max_line_width_mm = 6.0
# A second, image-size-independent guard: a candidate run must also be at least this many times
# longer (image height, for a column run; width, for a row run) than it is wide. `max_line_width_mm`
# alone is an *absolute* size, so on a small or heavily-cropped raster it can stop discriminating a
# genuine line from a squarish blob (a 24px-wide run in a 100px-tall crop clears the width cap at
# only ~4:1). Measured on the real scan (200dpi, 1708px tall): the 8 known grid/border columns
# range 44:1-1708:1. Set to 10.0 for a wide margin below that and above any compact blob.
min_elongation_ratio = 10.0

# --------------------------------------------------------------------------------------------
# Linear feature extraction (T014)
# --------------------------------------------------------------------------------------------
[linear]
# [ISOM] nominal printed widths for symbols 502/503 (road), 504 (vehicle track), 505 (footpath).
# A corridor's measured stroke width (distance-transform along its skeleton) is matched to the
# nearest of these, converted to pixels via the map's own DPI -- never hardcoded in pixels.
road_width_mm = 0.60
vehicle_track_width_mm = 0.35
footpath_width_mm = 0.25
# A `road`-labelled connected component smaller than this (px^2) is dropped as noise before the
# shape tests below run -- they are not stable on a handful of pixels.
min_component_area_px = 20
# skeleton_length / sqrt(area): how much longer a shape is than it is wide, size-independent. A
# straight corridor of width w and length L scores ~sqrt(L/w); a blob (glyph, point symbol) scores
# close to 1. See `vision/linear.py`'s module docstring.
elongation_ratio_min = 3.0
# minAreaRect's long side over its short side. Catches what the elongation ratio above cannot: a
# cluster of touching text glyphs has a branchy skeleton that can rack up enough pixels to pass the
# ratio above, but its bounding rectangle stays close to square. Measured against the fixture:
# touching-glyph clusters top out near 1.6, the shortest real corridor fragments start near 2.8.
aspect_ratio_min = 2.0
# A component's skeleton must also be at least this long on paper (mm, converted via DPI) to count
# as a corridor. Text and point symbols are bounded by a font's cap height or a symbol's diameter --
# a few mm; a real corridor is a through-route and is far longer. This is what actually rejects a
# single tall glyph, whose elongation ratio alone can rival a real corridor's.
min_length_mm = 8.0
# Morphological close radius (px) applied before finding components, to bridge the few pixels of
# scan noise or self-crossing a corridor can pick up. Kept small so it never merges a corridor with
# nearby unrelated ink.
close_radius_px = 2

# --------------------------------------------------------------------------------------------
# Slope from contour density (T015, ADR-006)
# --------------------------------------------------------------------------------------------
[slope]
# Gaussian sigma, in millimetres on paper (converted to pixels via the map's own DPI -- never
# hardcoded in pixels, the same convention [linear] uses), for blurring the contour mask into a
# local density field. 1.0mm @ 300dpi ~= 11.8px, close to the originally hand-tuned 12px value.
density_sigma_mm = 1.0
# Density is a locally-blurred contour-ink area fraction, clipped to [0, 1] -- not normalised to
# span it: gaps between contour lines are most of any real area, so a real map's steepest terrain
# never gets close to 1.0 (this project's own fixture measures well under 0.5 at its densest).
# Speed is divided by (1 + penalty * density^density_exponent); 1/(1 + penalty) is a theoretical
# floor reached only under solid, wall-to-wall contour ink, not a bound any real map's density
# actually reaches.
#
# T095/ADR-029 retune: penalty 2.0 -> 6.0 and density_exponent 1.0 -> 2.0 (was implicitly 1.0,
# i.e. linear). With density_exponent=2.0 the two curves cross at density = 1/3 (solve
# 1 + 2d = 1 + 6d^2): below that, a crossing costs the same or less than the old linear formula
# (small/sparse contour crossings barely matter -- "one storey" in the literature's "2-storey vs
# 10-storey climb" framing, docs/research/route-choice-heuristics.md Rule 6); above it, cost grows
# convexly and disproportionately (at density 0.5 -- near this project's own fixture's observed
# ceiling -- the penalty divisor is 2.5 vs the old formula's 2.0, +25%; at density 1.0 it is 7.0
# vs 3.0, +133%). Chosen from this project's own real-map corpus (`data/maps/`), not the
# literature's numbers directly (ADR-029 removed the unsupported "~5 contour lines" figure).
penalty = 6.0
density_exponent = 2.0

# --------------------------------------------------------------------------------------------
# Linear-feature proximity bonus (T095, ADR-029, Rules 2+7)
# --------------------------------------------------------------------------------------------
[proximity]
# Enabled 2026-09-12, owner sign-off (ADR-029's amendment) -- this section's other two numbers are
# still this task's own real-map best-effort starting point (`data/maps/`, a throwaway comparison
# script, not committed), not yet a corpus-validated final tuning.
enabled = true
# Ground metres, not paper millimetres -- see ProximitySettings' own docstring (config.py) for why:
# how far a runner still benefits from a nearby road/track/footpath is a real-world distance on the
# ground, converted to pixels via the map's own meters_per_pixel, not a printed size via DPI. The
# bonus is `1 + bonus_magnitude * exp(-distance_m / decay_distance_m)`: 1.0 (no bonus) far away,
# rising smoothly to `1 + bonus_magnitude` right on the feature; one decay_distance_m away, ~37% of
# the peak bonus remains (the classic e-folding distance).
decay_distance_m = 40.0
# Speed multiplier right on a linear-feature pixel is `1 + bonus_magnitude` -- 0.5 here means +50%.
bonus_magnitude = 0.5

# --------------------------------------------------------------------------------------------
# Control detection (T020, T021)
# --------------------------------------------------------------------------------------------
[detector]
# [ISOM] symbol 703 control circle, in millimetres on the printed map. The pixel radius follows
# from the map's DPI, so the detector never guesses a scale. T020 verifies these against the spec
# drawings and the real corpus.
circle_diameter_mm = 6.0
circle_diameter_tolerance = 0.35
# Control/hub ink hue bands (OpenCV HSV ranges: H 0-179, S 0-255, V 0-255). A mask is the union
# (OR) of every band listed here, all sharing the purple saturation/value floors below (I1,
# ADR-011). Purple: around ISOM purple 35_85_0_0. Red used to live here too (T073, ADR-011) but
# moved to its own `red_hue_ranges` below (ADR-018) once a second real scan showed the shared
# floor here is too permissive for red specifically -- see that comment for why.
# Renamed from the single `purple_hue_range = [lo, hi]` this replaced (T073, ADR-011): a hand-edited
# config file still carrying the old key name fails validation (DetectorSettings is extra="forbid")
# rather than being silently ignored -- rename the key to ink_hue_ranges = [[lo, hi]] (a list of
# bands, even for just one) to migrate it.
ink_hue_ranges = [[140, 175]]
purple_min_saturation = 60
purple_min_value = 60
# Red control/hub ink, split into its own band list with its own floor (ADR-018, T079). Originally
# folded into ink_hue_ranges above (T073, ADR-011) and measured off
# data/maps/grid-lines-red-controls/map.jpeg (I1) the same way: sampled every strongly-red pixel
# (R channel dominant over G and B by >60) and read its HSV. Saturation floor 61-255, value floor
# 151-255; hue clusters in two bands because red straddles OpenCV's H=0/179 wrap: hue 0-20 held
# 99% of the red-like pixels (hue=0: 12841px, hue=1: 9218px, tapering off through hue=20: 1px) and
# 167-179 the wrapped tail (hue=179: 11236px, hue=176: 781px). The low band is capped at 9, short
# of the full observed 0-20, because ISOM brown and yellow sit right next to red in hue:
# `tests/fixtures/synth_map.py`'s RENDER_SRGB["brown_100"] is HSV (13, 201, 190) and
# RENDER_SRGB["yellow_100"] is HSV (20, 191, 253) -- both fully saturated enough to pass a loose
# floor, so a band reaching hue 20 pulled contour lines and open-land fill into the mask too and
# broke TestHubTriangleDetection (a real regression found running T073's own suite). 0-9 keeps
# ~95% of the sampled red-ink pixels (hue<=9: 31043/32794) with a clear margin below brown's
# hue=13.
#
# ADR-018: a second real scan (data/maps/ozero-shchuche/map.jpg, no meta.toml/dpi, gitignored per
# ADR-010) showed the *shared* saturation/value floor above (60/60) is too permissive for this red
# band specifically -- brown contour ink on that file is saturated but dimmer than real red
# control ink (measured: 88% of that file's then-flagged pixels were brown, mean RGB
# (161, 106, 90), against 12% true purple, mean RGB (234, 66, 221)), and the red hue band was where
# nearly all of that brown leaked in. Two changes, both measured against grid-lines-red-controls
# (must not regress TestRealScanRedInk) and ozero-shchuche (must measurably drop) before landing:
#  - red_min_saturation/red_min_value raised from the shared 60/60 to this file's own measured
#    floor, 61/151 (see above) -- exact, not rounded, because the sampled red ink's minimum is
#    already 61/151: raising further would start cutting into the true ink (grid coverage drops
#    below the 95% floor above ~s=90), while this exact value loses nothing (still 99.01% coverage
#    of grid's strict-red pixels, same as the unrestricted 60/60 floor).
#  - red_min_channel_gap: minimum of (R-G) and (R-B) required within the red band, catching what
#    the saturation/value floor alone could not -- brown contour ink is saturated enough to pass
#    almost any S/V floor tried, but its R channel barely leads G/B (grid-lines-red-controls'
#    strict-red ink, by definition, always has R-G>60 and R-B>60, so a floor of 60 loses zero
#    coverage there; ozero-shchuche's brown-band pixels mostly sit at R-G/R-B 25-95, so most of
#    them fail it). Measured on ozero-shchuche: purple_mask density 6.818% -> 1.337% (below
#    grid-lines-red-controls' own 1.930%, now 1.345% with the same tightened floor); grid-lines-
#    red-controls' TestRealScanRedInk unaffected (coverage 99.01% >= 95% floor; recall/precision/
#    hub unchanged, see tests/unit/vision/test_controls.py).
red_hue_ranges = [[0, 9], [167, 179]]
red_min_saturation = 61
red_min_value = 151
red_min_channel_gap = 60
hough_dp = 1.2
hough_param1 = 100
hough_param2 = 30
# Scale multipliers `_detect_circles`/`_detect_hub_triangle` sweep the printed-size radius window
# through (T076, ADR-015). `1.0` is the ISOM 6mm print size above, unscaled. The >=1.0 rest cover
# hand-marked scans whose circles are drawn larger than print spec: measured on
# data/maps/grid-lines-red-controls/map.jpeg (I1, ADR-011/ADR-015), the true control rings are
# ~56px radius at 200dpi versus circle_radius_px(200)'s ~23.6px mid-radius -- a ~2.37x ratio,
# bracketed by both 2.0 and 2.5 (2.0 is the one `_select_best_scale` actually picks on this file:
# highest mean ring-coverage, 0.9943 vs 2.5's 0.9907 -- 2.5 is kept in the list as headroom, not
# because it's load-bearing here).
# `0.5`/`0.85` (T090, ADR-030/ADR-031): the opposite gap -- some hand-drawn scans' circles print
# *smaller* than ISOM spec (T089's H2 finding). `0.4` measured a false-positive blob cluster
# winning outright on a real scan (ADR-030) and is deliberately excluded; `0.5` is the measured
# floor. A sub-1.0 winner is never trusted on ring-coverage alone -- `_detect_circles` gates it
# behind an OCR-outcome comparison against the >=1.0 (production) winner before committing to it
# (`_ocr_gate_sub_base_scale`), which is also what keeps a same-ring tie between a sub-1.0 and a
# >=1.0 window (e.g. this list's own 0.85 vs 1.0 overlap) from silently handing a correctly-matched
# base-scale ring a mis-sized crop just because 0.85 now sweeps first.
circle_scale_multipliers = [0.5, 0.85, 1.0, 1.5, 2.0, 2.5, 3.0]
# [ISOM] symbol 704 control number: Arial 4.0 mm, non-bold, non-italic, oriented north.
number_font_height_mm = 4.0
# How far from the circle edge to look for the number, in circle radii.
number_search_radius = 1.8
# first_digit — the usual rogaine convention: every digit but the last (control 45 is worth 4
#               points, control 123 is worth 12)
# constant    — every control worth `points_constant`
# csv         — points come from the controls CSV and nothing is inferred
points_rule = "first_digit"
points_constant = 1
min_ocr_confidence = 0.6

# --------------------------------------------------------------------------------------------
# Opt-in VLM OCR fallback for control numbers only (T114, SPEC F23, ADR-039)
# --------------------------------------------------------------------------------------------
[ocr_fallback]
# Off by shipped default (ADR-039): both this flag AND a configured ANTHROPIC_API_KEY (env var
# only, never stored here) are required before any network call -- see vision/ocr_vlm.py's own
# docstring for the full inertness guarantee, and vision/ocr.py's read_control_number for the
# trigger condition this section only configures.
enabled = false
# A Tesseract read below this floor (or empty) triggers one fallback attempt on the same crop.
# Deliberately separate from [detector].min_ocr_confidence above, which gates Tesseract's own
# accept/reject decision, not whether a second, network-costing attempt is worth making.
trigger_confidence = 0.6
# Cost/latency tier matches reading 1-3 printed digits from a small cropped circle (see
# vision/ocr_vlm.py's own DEFAULT_MODEL comment) -- kept independently configurable here rather
# than hardcoded, in case a future model swap suits this task better.
model = "claude-haiku-4-5"
# Which backend the fallback calls (T116, ADR-040): "anthropic" (vision/ocr_vlm.py, needs
# ANTHROPIC_API_KEY) or "ollama" (vision/ocr_vlm_ollama.py, needs a reachable local server, no
# key, $0). Shipped as "anthropic" so this addition changes no existing behaviour or test; switch
# to "ollama" (and set `model` to a locally-installed vision model, e.g. "qwen2.5vl:7b") to run
# the fallback for free.
provider = "anthropic"
# Only consulted when provider = "ollama".
base_url = "http://localhost:11434"

# --------------------------------------------------------------------------------------------
# Cost field and graph (T030, T031, T032)
# --------------------------------------------------------------------------------------------
[graph]
# One graph node per NxN block of pixels. 4 keeps a 4000x3000 map at ~750k nodes (ADR-002).
downsample = 4
# Cost assigned to impassable ground when `strict_impassable` is false: high enough that the
# solver never routes through it unless there is no alternative at all.
impassable_cost_multiplier = 1000.0
strict_impassable = true

# --------------------------------------------------------------------------------------------
# Solvers (T040-T043)
# --------------------------------------------------------------------------------------------
[solver]
# "auto" picks exact below `exact_max_controls`, heuristic above it.
strategy = "auto"
exact_max_controls = 15
# Seconds. The heuristic returns the best route found when this runs out.
heuristic_time_budget_s = 30.0
grasp_restarts = 40
grasp_candidate_size = 5
seed = 0
# Number of structurally distinct alternatives to report (T043).
alternatives = 3

[rules]
# Points lost per minute of late return. Large values effectively forbid overrunning.
penalty_per_min = 1.0
