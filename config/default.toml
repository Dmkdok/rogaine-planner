isom = "101"
shade = "brown_100"
speed_factor = 0.0
passable = true
note = "not an area class: contours only feed the slope penalty (T015), never the speed table"

[[terrain]]
name = "unknown"
isom = ""
shade = "none"
speed_factor = 0.35
passable = true
note = "unclassified pixels are assumed to be forest — the most common terrain, and not optimistic"

# --------------------------------------------------------------------------------------------
# Linear feature extraction (T014)
# --------------------------------------------------------------------------------------------
[linear]
# [ISOM] nominal printed widths for symbols 502/503 (road), 504 (vehicle track), 505 (footpath).
# A corridor's measured stroke width (distance-transform along its skeleton) is matched to the
# nearest of these, converted to pixels via the map's own DPI -- never hardcoded in pixels.
road_width_mm = 0.60
vehicle_track_width_mm = 0.35
footpath_width_mm = 0.25
# A `road`-labelled connected component smaller than this (px^2) is dropped as noise before the
# shape tests below run -- they are not stable on a handful of pixels.
min_component_area_px = 20
# skeleton_length / sqrt(area): how much longer a shape is than it is wide, size-independent. A
# straight corridor of width w and length L scores ~sqrt(L/w); a blob (glyph, point symbol) scores
# close to 1. See `vision/linear.py`'s module docstring.
elongation_ratio_min = 3.0
# minAreaRect's long side over its short side. Catches what the elongation ratio above cannot: a
# cluster of touching text glyphs has a branchy skeleton that can rack up enough pixels to pass the
# ratio above, but its bounding rectangle stays close to square. Measured against the fixture:
# touching-glyph clusters top out near 1.6, the shortest real corridor fragments start near 2.8.
aspect_ratio_min = 2.0
# A component's skeleton must also be at least this long on paper (mm, converted via DPI) to count
# as a corridor. Text and point symbols are bounded by a font's cap height or a symbol's diameter --
# a few mm; a real corridor is a through-route and is far longer. This is what actually rejects a
# single tall glyph, whose elongation ratio alone can rival a real corridor's.
min_length_mm = 8.0
# Morphological close radius (px) applied before finding components, to bridge the few pixels of
# scan noise or self-crossing a corridor can pick up. Kept small so it never merges a corridor with
# nearby unrelated ink.
close_radius_px = 2

# --------------------------------------------------------------------------------------------
# Slope from contour density (T015, ADR-006)
# --------------------------------------------------------------------------------------------
[slope]
# Gaussian sigma (pixels) used to turn the contour mask into a local density field.
density_sigma = 12.0
# Density is normalised to [0, 1], then speed is divided by (1 + penalty * density).
# 2.0 means the steepest ground on the map costs three times the flat equivalent.
penalty = 2.0

# --------------------------------------------------------------------------------------------
# Control detection (T020, T021)
# --------------------------------------------------------------------------------------------
[detector]
# [ISOM] symbol 703 control circle, in millimetres on the printed map. The pixel radius follows
# from the map's DPI, so the detector never guesses a scale. T020 verifies these against the spec
# drawings and the real corpus.
circle_diameter_mm = 6.0
circle_diameter_tolerance = 0.35
# Purple in HSV (OpenCV ranges: H 0-179, S 0-255, V 0-255), around ISOM purple 35_85_0_0.
purple_hue_range = [140, 175]
purple_min_saturation = 60
purple_min_value = 60
hough_dp = 1.2
hough_param1 = 100
hough_param2 = 30
# [ISOM] symbol 704 control number: Arial 4.0 mm, non-bold, non-italic, oriented north.
number_font_height_mm = 4.0
# How far from the circle edge to look for the number, in circle radii.
number_search_radius = 1.8
# first_digit — the usual rogaine convention (control 45 is worth 4 points)
# constant    — every control worth `points_constant`
# csv         — points come from the controls CSV and nothing is inferred
points_rule = "first_digit"
points_constant = 1
min_ocr_confidence = 0.6

# --------------------------------------------------------------------------------------------
# Cost field and graph (T030, T031, T032)
# --------------------------------------------------------------------------------------------
[graph]
# One graph node per NxN block of pixels. 4 keeps a 4000x3000 map at ~750k nodes (ADR-002).
downsample = 4
# Cost assigned to impassable ground when `strict_impassable` is false: high enough that the
# solver never routes through it unless there is no alternative at all.
impassable_cost_multiplier = 1000.0
strict_impassable = true

# --------------------------------------------------------------------------------------------
# Solvers (T040-T043)
# --------------------------------------------------------------------------------------------
[solver]
# "auto" picks exact below `exact_max_controls`, heuristic above it.
strategy = "auto"
exact_max_controls = 15
# Seconds. The heuristic returns the best route found when this runs out.
heuristic_time_budget_s = 30.0
grasp_restarts = 40
grasp_candidate_size = 5
seed = 0
# Number of structurally distinct alternatives to report (T043).
alternatives = 3

[rules]
# Points lost per minute of late return. Large values effectively forbid overrunning.
penalty_per_min = 1.0
