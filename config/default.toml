# Rogaine route planner — default configuration.
#
# Everything tunable lives here (SPEC F18). Override with `--config my.toml`, or per run with
# individual CLI flags.
#
# Sources for the numbers below:
#   [A1] IOF, "ISOM 2017 Appendix 1 — CMYK Printing and Colour Definitions", version 3, 2018-11-07,
#        section 4 "CMYK Colour Definition" and the colour-order list.
#   [ISOM] IOF, "ISOM 2017-2" (adjusted January 2019), symbol descriptions.
#   [ART] https://habr.com/ru/articles/1065342/ — the reference implementation's rough ratios
#        ("forest almost three times slower than road, vegetation five times").

[map]
# Used when the raster carries no DPI of its own and the user gives none.
default_dpi = 300

# --------------------------------------------------------------------------------------------
# Palette (T013)
# --------------------------------------------------------------------------------------------
[palette]
# A pixel further than this from every known shade in CIELAB (CIE76) becomes `unknown`
# and is filled from its neighbourhood. Provisional: the shade table below is derived from the
# published CMYK, and the residual between derived and actually-printed colour is largest for
# green. T013 sets this from measured distances and T017 confirms it against the real corpus.
lab_distance_threshold = 35.0
# Kernel (pixels) for the neighbourhood majority vote that fills `unknown`.
unknown_fill_radius = 3

# The six ISOM inks, as CMYK percentages. Verbatim from [A1] section 4.
[palette.ink]
black = [0, 0, 0, 100]
blue = [100, 0, 0, 0]
yellow = [0, 27, 79, 0]
green = [76, 0, 91, 0]
brown = [0, 56, 100, 18]      # [A1]: for CMYK+B printing this is PMS 471
purple = [35, 85, 0, 0]       # [A1]: or PMS "Purple"

# The printed shades that actually appear on an ISOM map, from the colour-order list in [A1]
# section 4. `tint` is the screen percentage of the named ink.
[[palette.shade]]
name = "white"
ink = "none"
tint = 0

[[palette.shade]]
name = "yellow_100"
ink = "yellow"
tint = 100

[[palette.shade]]
name = "yellow_50"
ink = "yellow"
tint = 50

[[palette.shade]]
name = "green_100"
ink = "green"
tint = 100

[[palette.shade]]
name = "green_60"
ink = "green"
tint = 60

[[palette.shade]]
name = "green_30"
ink = "green"
tint = 30

[[palette.shade]]
name = "blue_100"
ink = "blue"
tint = 100

[[palette.shade]]
name = "blue_70"
ink = "blue"
tint = 70

[[palette.shade]]
name = "blue_50"
ink = "blue"
tint = 50

[[palette.shade]]
name = "brown_100"
ink = "brown"
tint = 100

[[palette.shade]]
name = "brown_50"
ink = "brown"
tint = 50

[[palette.shade]]
name = "black_100"
ink = "black"
tint = 100

[[palette.shade]]
name = "black_30"
ink = "black"
tint = 30

[[palette.shade]]
name = "purple_100"
ink = "purple"
tint = 100

# --------------------------------------------------------------------------------------------
# Terrain classes (T013, T014, T030)
# --------------------------------------------------------------------------------------------
# `speed_factor` is the fraction of the runner's *road* speed. Road = 1.0 by definition, so the
# user states one number they actually know ("I run 3 m/s on a road") and everything scales off it.
#
# `shade` is the colour a pixel of this class is printed in. Several classes share `black_100`:
# colour alone cannot tell a footpath from a cliff from a map label. T014 separates those
# geometrically (width, elongation, skeleton length); the palette classifier only produces the
# colour class, never the final linear class.

[[terrain]]
name = "open_land"
isom = "401"
shade = "yellow_100"
speed_factor = 0.55
passable = true
note = "[ISOM] ground cover offering better runnability than typical open forest"

[[terrain]]
name = "rough_open"
isom = "403"
shade = "yellow_50"
speed_factor = 0.35
passable = true
note = "[ISOM] 'offering the same runnability as typical open forest' — hence equal to forest"

[[terrain]]
name = "forest_runnable"
isom = "405"
shade = "white"
speed_factor = 0.35
passable = true
note = "[ART] forest is almost three times slower than road; this is the baseline for greens"

[[terrain]]
name = "veg_slow_run"
isom = "406"
shade = "green_30"
speed_factor = 0.25
passable = true
note = "[ISOM] 60-80% of normal speed -> 0.7 x forest"

[[terrain]]
name = "veg_walk"
isom = "408"
shade = "green_60"
speed_factor = 0.14
passable = true
note = "[ISOM] 20-60% of normal speed -> 0.4 x forest"

[[terrain]]
name = "veg_fight"
isom = "410"
shade = "green_100"
speed_factor = 0.0
passable = false
note = "ADR-037: owner ruling for this event -- forbidden to enter, not merely slow. General-literature calibration (0.05, i.e. 0.15x forest) was correct per [ISOM]'s own runnability band and stays documented in docs/research/route-choice-heuristics.md Rule 5; TerrainSpec's own validator requires speed_factor=0 for impassable terrain, same as out_of_bounds/water_uncrossable above."

[[terrain]]
name = "marsh"
isom = "308"
shade = "blue_50"
speed_factor = 0.15
passable = true
note = "[ISOM] crossable marsh"

[[terrain]]
name = "water_shallow"
isom = "302"
shade = "blue_70"
speed_factor = 0.08
passable = true
note = "[ISOM] shallow body of water — wadeable, very slow"

[[terrain]]
name = "water_uncrossable"
isom = "301"
shade = "blue_100"
speed_factor = 0.0
passable = false
note = "[ISOM] uncrossable body of water, emphasised by a black bank line"

[[terrain]]
name = "bare_rock"
isom = "214"
shade = "black_30"
speed_factor = 0.45
passable = true
note = "[ISOM] 'a runnable area of rock without earth or vegetation'"

[[terrain]]
name = "paved_area"
isom = "501"
shade = "brown_50"
speed_factor = 1.0
passable = true
note = "[ISOM] firm surface; [A1] road infill is brown 50% with black outlines"

[[terrain]]
name = "road"
isom = "502,503"
shade = "black_100"
speed_factor = 1.0
passable = true
note = "road speed is the definition of v_base"

[[terrain]]
name = "vehicle_track"
isom = "504"
shade = "black_100"
speed_factor = 0.95
passable = true

[[terrain]]
name = "footpath"
isom = "505"
shade = "black_100"
